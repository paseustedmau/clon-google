<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='78' font-size='90' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%234285f4'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <nav class="header__nav">
      <a href="https://mail.google.com" class="header__link">Gmail</a>
      <a href="https://www.google.com/imghp" class="header__link">Imágenes</a>

      <div class="apps">
        <button class="icon-btn" id="apps-btn" aria-label="Aplicaciones de Google" aria-expanded="false" aria-controls="apps-menu">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path fill="currentColor" d="M6,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM16,6c0,1.1 0.9,2 2,2s2,-0.9 2,-2 -0.9,-2 -2,-2 -2,0.9 -2,2zM12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2z"/>
          </svg>
        </button>

        <div class="apps__menu" id="apps-menu" hidden>
          <a href="https://www.google.com/search" class="apps__item"><span class="apps__icon" style="background:#4285f4">G</span>Búsqueda</a>
          <a href="https://maps.google.com" class="apps__item"><span class="apps__icon" style="background:#34a853">M</span>Maps</a>
          <a href="https://www.youtube.com" class="apps__item"><span class="apps__icon" style="background:#ea4335">▶</span>YouTube</a>
          <a href="https://play.google.com" class="apps__item"><span class="apps__icon" style="background:#01875f">P</span>Play</a>
          <a href="https://news.google.com" class="apps__item"><span class="apps__icon" style="background:#4285f4">N</span>Noticias</a>
          <a href="https://mail.google.com" class="apps__item"><span class="apps__icon" style="background:#ea4335">✉</span>Gmail</a>
          <a href="https://drive.google.com" class="apps__item"><span class="apps__icon" style="background:#fbbc05">D</span>Drive</a>
          <a href="https://calendar.google.com" class="apps__item"><span class="apps__icon" style="background:#4285f4">31</span>Calendar</a>
          <a href="https://translate.google.com" class="apps__item"><span class="apps__icon" style="background:#4285f4">T</span>Traductor</a>
        </div>
      </div>

      <a href="https://accounts.google.com" class="btn-signin">Iniciar sesión</a>
    </nav>
  </header>

  <main class="main">
    <h1 class="logo" aria-label="Google">
      <span class="logo--blue">G</span><span class="logo--red">o</span><span class="logo--yellow">o</span><span class="logo--blue">g</span><span class="logo--green">l</span><span class="logo--red">e</span>
    </h1>

    <form class="search" id="search-form" action="https://www.google.com/search" method="get" role="search">
      <div class="search__box">
        <svg class="search__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>

        <input class="search__input" id="search-input" type="text" name="q" autocomplete="off" aria-label="Buscar" autofocus>

        <button type="button" class="search__clear" id="clear-btn" aria-label="Borrar" hidden>
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>

        <button type="button" class="search__tool" id="voice-btn" aria-label="Búsqueda por voz">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path fill="#4285f4" d="m12 15c1.66 0 3-1.31 3-2.97v-7.02c0-1.66-1.34-3.01-3-3.01s-3 1.34-3 3.01v7.02c0 1.66 1.34 2.97 3 2.97z"/>
            <path fill="#34a853" d="m11 18.08h2v3.92h-2z"/>
            <path fill="#fbbc05" d="m7.05 16.87c-1.27-1.33-2.05-2.83-2.05-4.87h2c0 1.45 0.56 2.42 1.47 3.38v0.32l-1.15 1.18z"/>
            <path fill="#ea4335" d="m12 16.93a4.97 5.25 0 0 1 -3.54 -1.55l-1.41 1.49c1.26 1.34 3.02 2.13 4.95 2.13 3.87 0 6.99-2.92 6.99-7h-1.99c0 2.92-2.24 4.93-5 4.93z"/>
          </svg>
        </button>

        <a href="https://lens.google.com" class="search__tool" aria-label="Búsqueda por imagen">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <rect x="9" y="9" width="6" height="6" rx="3" fill="#4285f4"/>
            <path fill="#ea4335" d="M5 7.5V9H3V7.5A4.5 4.5 0 0 1 7.5 3H9v2H7.5A2.5 2.5 0 0 0 5 7.5z"/>
            <path fill="#4285f4" d="M19 7.5V9h2V7.5A4.5 4.5 0 0 0 16.5 3H15v2h1.5A2.5 2.5 0 0 1 19 7.5z"/>
            <path fill="#34a853" d="M19 16.5V15h2v1.5a4.5 4.5 0 0 1-4.5 4.5H15v-2h1.5a2.5 2.5 0 0 0 2.5-2.5z"/>
            <path fill="#fbbc05" d="M5 16.5V15H3v1.5A4.5 4.5 0 0 0 7.5 21H9v-2H7.5A2.5 2.5 0 0 1 5 16.5z"/>
          </svg>
        </a>
      </div>

      <div class="search__buttons">
        <button type="submit" class="btn">Buscar con Google</button>
        <button type="submit" class="btn">Voy a tener suerte</button>
      </div>
    </form>

    <p class="languages">
      Google disponible en:
      <a href="https://www.google.com/setprefs?hl=en">English</a>
      <a href="https://www.google.com/setprefs?hl=pt-BR">Português</a>
      <a href="https://www.google.com/setprefs?hl=fr">Français</a>
    </p>
  </main>

  <footer class="footer">
    <div class="footer__country" id="country">México</div>
    <div class="footer__links">
      <nav class="footer__group">
        <a href="https://about.google">Sobre Google</a>
        <a href="https://ads.google.com">Publicidad</a>
        <a href="https://www.google.com/services">Negocios</a>
        <a href="https://google.com/search/howsearchworks">Cómo funciona la Búsqueda</a>
      </nav>
      <nav class="footer__group">
        <a href="https://policies.google.com/privacy">Privacidad</a>
        <a href="https://policies.google.com/terms">Condiciones</a>
        <a href="https://www.google.com/preferences">Preferencias</a>
      </nav>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
